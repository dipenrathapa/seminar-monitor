name: Seminar Slot Monitor

on:
  schedule:
    # Every 6 minutes = optimal for GitHub free tier
    # 43,200 min/month / 6 = 7,200 runs x ~15sec = 1,800 min used (under 2,000 limit)
    - cron: '*/6 * * * *'

  # Lets you also click "Run workflow" manually from GitHub UI
  workflow_dispatch:

jobs:
  check-slots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Restore alert state cache
        uses: actions/cache@v4
        with:
          path: alerted_slots.json
          key: alerted-slots-cache
          restore-keys: alerted-slots-cache

      - name: Run monitor
        run: python monitor.py

      - name: Save alert state cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: alerted_slots.json
          key: alerted-slots-cache-${{ github.run_id }}