name: Seminar Slot Monitor

on:
  schedule:
    - cron: '*/6 * * * *'
  workflow_dispatch:

jobs:
  check-slots:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    # Give the job permission to push back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Restore alert state cache
        uses: actions/cache@v4
        with:
          path: alerted_slots.json
          key: alerted-slots-cache
          restore-keys: alerted-slots-cache

      - name: Run monitor
        run: python monitor.py

      # Commit alerted_slots.json back to repo as reliable backup
      # [skip ci] prevents this commit from triggering another workflow run
      - name: Save state to repo (backup)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alerted_slots.json
          git diff --cached --quiet || git commit -m "chore: update alert state [skip ci]"
          git push

      - name: Save alert state cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: alerted_slots.json
          key: alerted-slots-cache-${{ github.run_id }}